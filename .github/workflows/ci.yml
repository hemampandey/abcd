name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q
      - name: Vercel requirements match backend pins
        run: |
          for pkg in $(grep -v '^#' ../requirements.txt); do
            grep -qx "$pkg" requirements.txt || { echo "::error::$pkg not pinned in backend/requirements.txt"; exit 1; }
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t windsight .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name ws windsight
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs "localhost:8000/api/day/2026-01-15" > /dev/null
          curl -fs localhost:8000/ | grep -q WindSight
