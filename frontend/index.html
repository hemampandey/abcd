<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Day-ahead wind forecast decision support for GB power buyers" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>WindSight · Day-ahead wind desk</title>
    <script>
      // Set the theme before first paint to avoid a flash: saved choice, else OS preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
